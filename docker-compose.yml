services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optionwise
      POSTGRES_PASSWORD: optionwise
      POSTGRES_DB: optionwise
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  api:
    build: .
    command: npm --workspace apps/api run dev
    env_file: .env.example
    ports: ["4000:4000"]
    depends_on: [postgres]
  web:
    build: .
    command: npm --workspace apps/web run dev
    env_file: .env.example
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { postgres: {} }
